<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Trailers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
        }

        header {
            background-color: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #ff0000;
        }

        header h1 {
            font-size: 40px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .movie {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .movie img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .movie h3 {
            margin: 10px 0;
        }

        .movie button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .movie button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎬 Movie Trailers</h1>
    </header>

    <div class="container">
        <div class="movie">
            <img src="https://via.placeholder.com/250x300?text=Action" alt="Movie 1">
            <h3>Action Movie</h3>
            <button>Watch Trailer</button>
        </div>

        <div class="movie">
            <img src="https://via.placeholder.com/250x300?text=Comedy" alt="Movie 2">
            <h3>Comedy Film</h3>
            <button>Watch Trailer</button>
        </div>

        <div class="movie">
            <img src="https://via.placeholder.com/250x300?text=Drama" alt="Movie 3">
            <h3>Drama Series</h3>
            <button>Watch Trailer</button>
        </div>

        <div class="movie">
            <img src="https://via.placeholder.com/250x300?text=SciFi" alt="Movie 4">
            <h3>Sci-Fi Adventure</h3>
            <button>Watch Trailer</button>
        </div>
    </div>
</body>
</html>
